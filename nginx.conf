# OrderFlow — Nginx configuration
# Place in: /etc/nginx/sites-available/orderflow
# Enable: ln -s /etc/nginx/sites-available/orderflow /etc/nginx/sites-enabled/
# SSL: certbot --nginx -d orders.001.com.mx

server {
    listen 80;
    server_name orders.001.com.mx;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name orders.001.com.mx;

    # SSL — managed by certbot
    ssl_certificate     /etc/letsencrypt/live/orders.001.com.mx/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/orders.001.com.mx/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Content-Type-Options   nosniff;
    add_header X-Frame-Options          SAMEORIGIN;
    add_header X-XSS-Protection         "1; mode=block";
    add_header Referrer-Policy          strict-origin-when-cross-origin;

    client_max_body_size 20M;

    # ─── Stripe webhook: raw body passthrough, NO compression ────────────────
    location /api/webhooks/stripe {
        proxy_pass              http://localhost:3001;
        proxy_http_version      1.1;
        proxy_set_header        Host $host;
        proxy_set_header        X-Real-IP $remote_addr;
        proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_pass_request_body on;
        # CRITICAL: Do NOT compress or buffer — Stripe signature requires raw body
        proxy_request_buffering off;
        gzip                    off;
    }

    # ─── Block direct access to prescriptions directory ───────────────────────
    location /var/orderflow/prescriptions {
        deny all;
        return 403;
    }

    # ─── All other API + app traffic ─────────────────────────────────────────
    location / {
        proxy_pass              http://localhost:3001;
        proxy_http_version      1.1;
        proxy_set_header        Upgrade $http_upgrade;
        proxy_set_header        Connection 'upgrade';
        proxy_set_header        Host $host;
        proxy_set_header        X-Real-IP $remote_addr;
        proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_cache_bypass      $http_upgrade;
        proxy_connect_timeout   60s;
        proxy_send_timeout      60s;
        proxy_read_timeout      60s;
    }
}
